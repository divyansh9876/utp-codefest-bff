spring.application.name=demo

# Load MONGODB_URI etc. from demo/.env locally; on Render real env vars are used.
spring.config.import=optional:file:.env[.properties]

spring.mongodb.uri=${MONGODB_URI}
# Atlas's copied URI has no database path (".../?appName=..."), so name it here.
spring.mongodb.database=${MONGODB_DATABASE:codefest}
spring.data.mongodb.auto-index-creation=true

# JWT signing key: 32+ random bytes. If unset, a random key is used (tokens reset on restart).
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}

# Render injects PORT; 8080 locally (the frontend's BFF_URL default).
server.port=${PORT:8080}
# Render terminates HTTPS at its proxy; trust X-Forwarded-* so Swagger's server URL is https.
server.forward-headers-strategy=framework

# Swagger UI spec dropdown: what the code implements now vs. the full workshop contract.
springdoc.swagger-ui.urls[0].name=Implemented (generated from code)
springdoc.swagger-ui.urls[0].url=/v3/api-docs
springdoc.swagger-ui.urls[1].name=Workshop contract (openapi.yaml)
springdoc.swagger-ui.urls[1].url=/openapi.yaml
springdoc.swagger-ui.urls-primary-name=Workshop contract (openapi.yaml)
